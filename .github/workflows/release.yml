name: Release

# Push a tag like v0.1.0 to build every platform and attach the files to a DRAFT GitHub Release.
# Nothing is signed with a paid certificate: macOS builds are ad-hoc signed (build/macos-adhoc-sign.cjs)
# and not notarized, Windows builds are unsigned. Review the draft, then publish it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-latest
            script: package:mac
            args: --arm64
          - name: mac-x64
            os: macos-latest
            script: package:mac
            args: --x64
          - name: windows-x64
            os: windows-latest
            script: package:win
            args: --x64
          - name: linux-x64
            os: ubuntu-latest
            script: package:linux
            args: --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder rebuilds better-sqlite3 for the target Electron version and arch
      # (npmRebuild: true). --publish never: the release job below does the upload.
      - name: Package
        run: npm run ${{ matrix.script }} -- ${{ matrix.args }} --publish never
        env:
          # No signing certificates exist; stop electron-builder looking for one in the keychain
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          path: dist-release
          pattern: release-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
