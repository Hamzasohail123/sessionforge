# TEMPORARY: macOS stress run for e2e/devtools.spec.ts (step 4 DevTools crash).
# Delete this file before the PR merges.
name: tmp-devtools-stress

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tmp-devtools-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: devtools.spec.ts x20 (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 is installed for Node; the Electron e2e run needs it built for Electron
      - name: Rebuild native modules for Electron
        run: npm run rebuild:native

      - name: Build the app
        run: npx electron-vite build

      - name: Stress e2e/devtools.spec.ts
        run: npx playwright test --project=e2e e2e/devtools.spec.ts --repeat-each=20

      - name: Collect Electron crash reports
        if: always()
        run: |
          mkdir -p crash-reports
          find ~/Library/Logs/DiagnosticReports -maxdepth 2 -name 'Electron*' -exec cp {} crash-reports/ \; 2>/dev/null || true
          ls -la crash-reports
          for f in crash-reports/*; do [ -f "$f" ] || continue; echo "== $f"; head -c 8000 "$f"; echo; done

      - name: Upload test output and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devtools-stress-macos
          path: |
            test-results/
            crash-reports/
          if-no-files-found: ignore
          retention-days: 3
