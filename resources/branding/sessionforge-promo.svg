<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">SessionForge, Every role. One window.</title>
  <desc id="desc">SessionForge promotional tile with the SessionForge icon and the tagline Every role. One window.</desc>
  <defs>
    <filter id="sf-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <!-- Square and opaque: the Chrome Web Store rejects promo tiles with transparency -->
  <rect width="440" height="280" fill="#0b112b"/>
  <rect x="2" y="2" width="436" height="276" rx="28" fill="none" stroke="#6774dc" stroke-opacity="0.42" stroke-width="2"/>
  <circle cx="74" cy="38" r="156" fill="#4456db" fill-opacity="0.10"/>
  <!-- Soft cyan glow so the dark icon stands out from the dark tile -->
  <rect x="34" y="64" width="152" height="152" rx="40" fill="#22d3ee" fill-opacity="0.45" filter="url(#sf-glow)"/>
  <!-- generate-icons.mjs replaces this href with the icon, corners masked and downscaled to 164 px -->
  <image href="sessionforge-icon-source.png" x="28" y="58" width="164" height="164"/>
  <rect x="212" y="102" width="31" height="5" rx="2.5" fill="#57d8e2"/>
  <!-- generate-icons.mjs embeds DejaVu Sans as 'SessionForge Promo', so the text never falls back to another font -->
  <text x="211" y="143" font-family="'SessionForge Promo', 'DejaVu Sans', sans-serif" font-size="27" font-weight="700" fill="#f7f8ff">SessionForge</text>
  <text x="212" y="170" font-family="'SessionForge Promo', 'DejaVu Sans', sans-serif" font-size="14" font-weight="400" fill="#cbd3ff">Every role. One window.</text>
</svg>
