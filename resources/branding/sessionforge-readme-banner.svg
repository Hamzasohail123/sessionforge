<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">SessionForge, Every role. One window.</title>
  <desc id="desc">SessionForge README banner with the SessionForge icon, the tagline Every role. One window., and the line Isolated logins, split view, MCP for coding agents.</desc>
  <!-- Same look as the store marquee (sessionforge-promo-marquee.svg), wider for the top of README.md.
       Outside the rounded card the PNG is transparent, so it sits cleanly on GitHub's light and dark themes. -->
  <defs>
    <clipPath id="sf-card">
      <rect x="2" y="2" width="1276" height="396" rx="40"/>
    </clipPath>
    <filter id="sf-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <g clip-path="url(#sf-card)">
    <rect width="1280" height="400" fill="#0b112b"/>
    <circle cx="250" cy="20" r="290" fill="#4456db" fill-opacity="0.10"/>
    <circle cx="1180" cy="430" r="220" fill="#22d3ee" fill-opacity="0.05"/>
  </g>
  <rect x="2" y="2" width="1276" height="396" rx="40" fill="none" stroke="#6774dc" stroke-opacity="0.42" stroke-width="3"/>
  <!-- Soft cyan glow so the dark icon stands out from the dark card -->
  <rect x="122" y="72" width="256" height="256" rx="68" fill="#22d3ee" fill-opacity="0.45" filter="url(#sf-glow)"/>
  <!-- generate-icons.mjs replaces this href with the icon, corners masked and downscaled to 280 px -->
  <image href="sessionforge-icon-source.png" x="110" y="60" width="280" height="280"/>
  <rect x="452" y="108" width="64" height="10" rx="5" fill="#57d8e2"/>
  <!-- generate-icons.mjs embeds DejaVu Sans as 'SessionForge Promo', so the text never falls back to another font -->
  <text x="448" y="206" font-family="'SessionForge Promo', 'DejaVu Sans', sans-serif" font-size="84" font-weight="700" fill="#f7f8ff">SessionForge</text>
  <text x="452" y="262" font-family="'SessionForge Promo', 'DejaVu Sans', sans-serif" font-size="36" font-weight="400" fill="#cbd3ff">Every role. One window.</text>
  <text x="452" y="308" font-family="'SessionForge Promo', 'DejaVu Sans', sans-serif" font-size="22" font-weight="400" fill="#8f9bd6">Isolated logins · split view · MCP for coding agents</text>
</svg>
