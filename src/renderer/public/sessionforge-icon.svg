<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SessionForge</title>
  <desc id="desc">Four colorful browser session panes connected by a central forge spark on a navy rounded square.</desc>
  <defs>
    <linearGradient id="sf-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101936"/>
      <stop offset="0.52" stop-color="#17245a"/>
      <stop offset="1" stop-color="#2c185f"/>
    </linearGradient>
    <linearGradient id="sf-spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#d7e5ff"/>
      <stop offset="1" stop-color="#7ce2ed"/>
    </linearGradient>
    <radialGradient id="sf-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7387ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7387ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sf-soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="sf-tile-clip">
      <rect x="20" y="20" width="472" height="472" rx="116"/>
    </clipPath>
    <g id="sf-mark">
      <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#sf-base)" stroke="#5969df" stroke-width="4"/>
      <rect x="40" y="40" width="432" height="432" rx="98" fill="none" stroke="#aab5ff" stroke-opacity="0.16" stroke-width="3"/>

      <g clip-path="url(#sf-tile-clip)">
        <circle cx="256" cy="256" r="116" fill="url(#sf-halo)" filter="url(#sf-soft-glow)"/>

        <g fill="none" stroke-linecap="round" stroke-width="15" opacity="0.72">
          <path d="M180 180 L256 256" stroke="#4bd3e0"/>
          <path d="M332 180 L256 256" stroke="#aa8bff"/>
          <path d="M180 332 L256 256" stroke="#f4b95f"/>
          <path d="M332 332 L256 256" stroke="#58d99a"/>
        </g>

        <!-- Four isolated session panes. The broad color bands stay visible at small sizes. -->
        <g>
          <rect x="83" y="83" width="143" height="143" rx="38" fill="#e6f2f8"/>
          <rect x="83" y="126" width="143" height="100" fill="#dce9f7"/>
          <path d="M121 83H188A38 38 0 0 1 226 121V127H83V121A38 38 0 0 1 121 83Z" fill="#38cbd7"/>
          <rect x="83" y="83" width="143" height="143" rx="38" fill="none" stroke="#f4f7ff" stroke-opacity="0.36" stroke-width="4"/>
        </g>
        <g>
          <rect x="286" y="83" width="143" height="143" rx="38" fill="#ece9fb"/>
          <rect x="286" y="126" width="143" height="100" fill="#e4e5fa"/>
          <path d="M324 83H391A38 38 0 0 1 429 121V127H286V121A38 38 0 0 1 324 83Z" fill="#a68aff"/>
          <rect x="286" y="83" width="143" height="143" rx="38" fill="none" stroke="#f6f4ff" stroke-opacity="0.36" stroke-width="4"/>
        </g>
        <g>
          <rect x="83" y="286" width="143" height="143" rx="38" fill="#fff0d8"/>
          <rect x="83" y="329" width="143" height="100" fill="#f9e6c5"/>
          <path d="M121 286H188A38 38 0 0 1 226 324V330H83V324A38 38 0 0 1 121 286Z" fill="#f0b552"/>
          <rect x="83" y="286" width="143" height="143" rx="38" fill="none" stroke="#fff8ed" stroke-opacity="0.42" stroke-width="4"/>
        </g>
        <g>
          <rect x="286" y="286" width="143" height="143" rx="38" fill="#e0f5e9"/>
          <rect x="286" y="329" width="143" height="100" fill="#d4f0e2"/>
          <path d="M324 286H391A38 38 0 0 1 429 324V330H286V324A38 38 0 0 1 324 286Z" fill="#50d497"/>
          <rect x="286" y="286" width="143" height="143" rx="38" fill="none" stroke="#f0fff7" stroke-opacity="0.42" stroke-width="4"/>
        </g>

        <!-- The bridge mark is the shared forge where the sessions meet. -->
        <circle cx="256" cy="256" r="49" fill="#111b43" stroke="#8996ff" stroke-opacity="0.85" stroke-width="6"/>
        <path d="M256 204L270 242L308 256L270 270L256 308L242 270L204 256L242 242Z" fill="url(#sf-spark)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="256" cy="256" r="13" fill="#6174e7"/>
      </g>
    </g>
  </defs>
  <use href="#sf-mark"/>
</svg>
